name: Compilar Proyecto Android ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4

    - name: Descomprimir y Reestructurar Botones Mal Formados
      run: |
        unzip *.zip
        
        # Buscar la carpeta raiz del proyecto Android
        CONFIG_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -z "$CONFIG_PATH" ]; then
          echo "ERROR: No se encontro settings.gradle.kts dentro del ZIP."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$CONFIG_PATH")
        echo "PROJECT_ROOT=$PROJECT_DIR" >> $GITHUB_ENV
        
        # 1. Forzar compatibilidad de Java 21 en el build.gradle.kts de la app
        GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
        if [ -f "$GRADLE_FILE" ]; then
          sed -i '/android {/a \    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_21\n        targetCompatibility = JavaVersion.VERSION_21\n    }\n    kotlinOptions {\n        jvmTarget = "21"\n    }' "$GRADLE_FILE"
        fi

        # 2. Reparar la sintaxis rota de ChatGPT usando expresiones regulares avanzadas
        UI_DIR="$PROJECT_DIR/app/src/main/java/com/espinoza/biomedicalservice/ui"
        if [ -d "$UI_DIR" ]; then
          echo "Corrigiendo estructura de componentes Compose..."
          
          # Corrección específica para el botón de guardar mal formado de ChatGPT
          sed -i -E 's/Button\(onClick = \{([^}]*)\}\)\s*\([^)]*\)\s*\{\s*Text\(([^)]*)\)\s*\}/Button(onClick = { \1 }, modifier = Modifier.fillMaxWidth()) { Text(\2) }/g' "$UI_DIR/ClienteFormScreen.kt" || true
          sed -i -E 's/Button\(onClick = \{([^}]*)\}\)\s*\([^)]*\)\s*\{\s*Text\(([^)]*)\)\s*\}/Button(onClick = { \1 }, modifier = Modifier.fillMaxWidth()) { Text(\2) }/g' "$UI_DIR/EquipoFormScreen.kt" || true
          
          # Corrección específica para el botón de cancelar mal formado de ChatGPT
          sed -i -E 's/OutlinedButton\(onClick = \{([^}]*)\}\)\s*\([^)]*\)\s*\{\s*Text\(([^)]*)\)\s*\}/OutlinedButton(onClick = { \1 }, modifier = Modifier.fillMaxWidth()) { Text(\2) }/g' "$UI_DIR/ClienteFormScreen.kt" || true
          sed -i -E 's/OutlinedButton\(onClick = \{([^}]*)\}\)\s*\([^)]*\)\s*\{\s*Text\(([^)]*)\)\s*\}/OutlinedButton(onClick = { \1 }, modifier = Modifier.fillMaxWidth()) { Text(\2) }/g' "$UI_DIR/EquipoFormScreen.kt" || true
          
          # Parche genérico por si quedaron remanentes sueltos de ).Modifier o }).Modifier
          sed -i 's/})(\(Modifier[^)]*)\)//g' "$UI_DIR/ClienteFormScreen.kt" || true
          sed -i 's/})(\(Modifier[^)]*)\)//g' "$UI_DIR/EquipoFormScreen.kt" || true
        fi

    - name: Compilar aplicacion Android
      run: |
        cd ${{ env.PROJECT_ROOT }}
        gradle build --no-daemon
