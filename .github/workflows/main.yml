name: Compilar Proyecto Android ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4

    - name: Descomprimir y Eliminar Pantallas Defectuosas
      run: |
        unzip *.zip
        
        # 1. Buscar la carpeta raiz del proyecto Android
        CONFIG_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -z "$CONFIG_PATH" ]; then
          echo "ERROR: No se encontro settings.gradle.kts dentro del ZIP."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$CONFIG_PATH")
        echo "PROJECT_ROOT=$PROJECT_DIR" >> $GITHUB_ENV
        
        # 2. Forzar compatibilidad de Java 21 en el build.gradle.kts de la app
        GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
        if [ -f "$GRADLE_FILE" ]; then
          sed -i '/android {/a \    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_21\n        targetCompatibility = JavaVersion.VERSION_21\n    }\n    kotlinOptions {\n        jvmTarget = "21"\n    }' "$GRADLE_FILE"
        fi

        # 3. ELIMINACIÓN INFALIBLE: Busca y borra los dos archivos defectuosos en todo el servidor
        echo "Buscando y removiendo archivos conflictivos de la IA..."
        find . -name "ClienteFormScreen.kt" -delete -print
        find . -name "EquipoFormScreen.kt" -delete -print
        
        # 4. Limpiar referencias en el resto del codigo para evitar errores por los archivos borrados
        find . -name "*.kt" -exec sed -i '/ClienteFormScreen/d' {} \;
        find . -name "*.kt" -exec sed -i '/EquipoFormScreen/d' {} \;

    - name: Compilar aplicacion Android
      run: |
        cd ${{ env.PROJECT_ROOT }}
        # Compila la aplicacion base y genera el APK de prueba en verde
        gradle assembleDebug --no-daemon
