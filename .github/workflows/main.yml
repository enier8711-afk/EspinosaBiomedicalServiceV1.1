name: Compilar Proyecto Android ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4

    - name: Descomprimir y buscar el proyecto
      run: |
        unzip *.zip
        CONFIG_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -z "$CONFIG_PATH" ]; then
          echo "ERROR: No se encontro settings.gradle.kts dentro del ZIP."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$CONFIG_PATH")
        echo "PROJECT_ROOT=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Compilar forzando Java 21 de forma Global
      run: |
        cd ${{ env.PROJECT_ROOT }}
        # Usamos las propiedades del sistema para obligar al compilador de Java y Kotlin a usar la Toolchain 21
        gradle build --no-daemon -Porg.gradle.java.installations.auto-download=false -Dorg.gradle.java.home=$JAVA_HOME_21_X64
