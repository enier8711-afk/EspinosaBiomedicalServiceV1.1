name: Compilar Proyecto Android ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4

    - name: Descomprimir y Reemplazar Archivos Defectuosos
      run: |
        unzip *.zip
        
        # Buscar la carpeta raiz del proyecto Android
        CONFIG_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -z "$CONFIG_PATH" ]; then
          echo "ERROR: No se encontro settings.gradle.kts dentro del ZIP."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$CONFIG_PATH")
        echo "PROJECT_ROOT=$PROJECT_DIR" >> $GITHUB_ENV
        
        # Forzar compatibilidad de Java 21 en el build.gradle.kts de la app
        GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
        if [ -f "$GRADLE_FILE" ]; then
          sed -i '/android {/a \    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_21\n        targetCompatibility = JavaVersion.VERSION_21\n    }\n    kotlinOptions {\n        jvmTarget = "21"\n    }' "$GRADLE_FILE"
        fi

        # Definir ruta de las pantallas de la interfaz de usuario
        UI_DIR="$PROJECT_DIR/app/src/main/java/com/espinoza/biomedicalservice/ui"
        
        if [ -d "$UI_DIR" ]; then
          echo "Reescribiendo EquipoFormScreen.kt de forma profesional..."
          cat << 'EOF' > "$UI_DIR/EquipoFormScreen.kt"
          package com.espinoza.biomedicalservice.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavController
          import com.espinoza.biomedicalservice.data.*
          import kotlinx.coroutines.launch

          @Composable
          fun EquipoFormScreen(dao: EquipoDao, clienteDao: ClienteDao, nav: NavController) {
              val clientes by clienteDao.observarActivos().collectAsState(initial = emptyList())
              val scope = rememberCoroutineScope()
              var clientId by remember { mutableStateOf<Int?>(null) }
              var tipo by remember { mutableStateOf("") }
              var serie by remember { mutableStateOf("") }
              var modelo by remember { mutableStateOf("") }
              var inventario by remember { mutableStateOf("") }
              var ubicacion by remember { mutableStateOf("") }

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Nuevo equipo", style = MaterialTheme.typography.titleLarge)
                  Spacer(modifier = Modifier.height(16.dp))
                  
                  Field("Tipo de equipo", tipo) { tipo = it }
                  Field("Número de serie", serie) { serie = it }
                  Field("Modelo", modelo) { modelo = it }
                  Field("Inventario", inventario) { inventario = it }
                  Field("Ubicación", ubicacion) { ubicacion = it }
                  
                  Spacer(modifier = Modifier.height(24.dp))

                  Button(
                      onClick = {
                          scope.launch {
                              dao.insertar(Equipo(clientId = clientId ?: 0, tipo = tipo, serie = serie, modelo = modelo, inventario = inventario, ubicacion = ubicacion))
                              nav.popBackStack()
                          }
                      },
                      enabled = tipo.isNotEmpty() && serie.isNotEmpty(),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Guardar equipo")
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedButton(
                      onClick = { nav.popBackStack() },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Cancelar")
                  }
              }
          }

          @Composable
          private fun Field(label: String, value: String, onValueChange: (String) -> Unit) {
              OutlinedTextField(
                  value = value,
                  onValueChange = onValueChange,
                  label = { Text(label) },
                  modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp)
              )
          }
          EOF

          echo "Reescribiendo ClienteFormScreen.kt de forma profesional..."
          cat << 'EOF' > "$UI_DIR/ClienteFormScreen.kt"
          package com.espinoza.biomedicalservice.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavController
          import com.espinoza.biomedicalservice.data.*
          import kotlinx.coroutines.launch

          @Composable
          fun ClienteFormScreen(dao: ClienteDao, nav: NavController) {
              val scope = rememberCoroutineScope()
              var nombre by remember { mutableStateOf("") }
              var telefono by remember { mutableStateOf("") }
              var correo by remember { mutableStateOf("") }
              var direccion by remember { mutableStateOf("") }
              var observaciones by remember { mutableStateOf("") }

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Nuevo cliente", style = MaterialTheme.typography.titleLarge)
                  Spacer(modifier = Modifier.height(16.dp))
                  
                  Field("Nombre", nombre) { nombre = it }
                  Field("Teléfono", telefono) { telefono = it }
                  Field("Correo", correo) { correo = it }
                  Field("Dirección", direccion) { direccion = it }
                  Field("Observaciones", observaciones) { observaciones = it }
                  
                  Spacer(modifier = Modifier.height(24.dp))

                  Button(
                      onClick = {
                          scope.launch {
                              dao.insertar(Cliente(nombre = nombre, telefono = telefono, correo = correo, direccion = direccion, observaciones = observaciones))
                              nav.popBackStack()
                          }
                      },
                      enabled = nombre.isNotEmpty(),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Guardar cliente")
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedButton(
                      onClick = { nav.popBackStack() },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Cancelar")
                  }
              }
          }

          @Composable
          private fun Field(label: String, value: String, onValueChange: (String) -> Unit) {
              OutlinedTextField(
                  value = value,
                  onValueChange = onValueChange,
                  label = { Text(label) },
                  modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp)
              )
          }
          EOF
        fi

    - name: Compilar aplicacion Android
      run: |
        cd ${{ env.PROJECT_ROOT }}
        gradle build --no-daemon
