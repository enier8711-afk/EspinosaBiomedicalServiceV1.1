name: Compilar Proyecto Android ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Requerido por Kotlin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4

    - name: Descomprimir y buscar el proyecto
      run: |
        unzip *.zip
        CONFIG_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -z "$CONFIG_PATH" ]; then
          echo "ERROR: No se encontro settings.gradle.kts dentro del ZIP."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$CONFIG_PATH")
        echo "PROJECT_ROOT=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Forzar compatibilidad de Java y Compilar
      run: |
        cd ${{ env.PROJECT_ROOT }}
        # Forzamos las opciones de Java para resolver el conflicto de compatibilidad
        gradle build --no-daemon -Dorg.gradle.java.home=$JAVA_HOME_21_X64 -Pandroid.uniquePackageNames=true
