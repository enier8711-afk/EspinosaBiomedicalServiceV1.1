name: Compilar Proyecto Android ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4

    - name: Descomprimir y Corregir Compatibilidad de Java
      run: |
        unzip *.zip
        
        # Buscar la carpeta raiz del proyecto Android
        CONFIG_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
        if [ -z "$CONFIG_PATH" ]; then
          echo "ERROR: No se encontro settings.gradle.kts dentro del ZIP."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$CONFIG_PATH")
        echo "PROJECT_ROOT=$PROJECT_DIR" >> $GITHUB_ENV
        
        # Modificar dinamicamente el archivo build.gradle.kts para forzar Java 21
        GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
        if [ -f "$GRADLE_FILE" ]; then
          echo "Corrigiendo compatibilidad de Java en build.gradle.kts..."
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_21/g' "$GRADLE_FILE"
          sed -i 's/compatibility = 1.8/compatibility = 21/g' "$GRADLE_FILE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "21"/g' "$GRADLE_FILE"
        fi

    - name: Compilar aplicacion Android
      run: |
        cd ${{ env.PROJECT_ROOT }}
        gradle build --no-daemon
