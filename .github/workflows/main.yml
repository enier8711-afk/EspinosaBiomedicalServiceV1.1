name: Compilar Proyecto ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Descomprimir todo de forma automatica
      run: |
        unzip *.zip
        # Mueve todo el contenido al directorio raiz si se creo una subcarpeta
        find . -mindepth 2 -maxdepth 2 -type d -name "src" -exec sh -c 'mv "${0%/*}"/* .' {} \;
        
    - name: Dar permisos de ejecucion al compilador
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        find . -name "gradlew" -exec cp {} . \; 2>/dev/null || true

    - name: Compilar con Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew build
        else
          echo "Buscando gradlew en subcarpetas..."
          $(find . -name "gradlew" | head -n 1) build
        fi
